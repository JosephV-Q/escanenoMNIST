<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocedor MNIST</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <h1>Reconocedor de Números <span>(IA)</span></h1>
            <p class="descripcion">Sube una imagen de un número escrito a mano (0-9).</p>

            <form id="formulario">
                <label class="selector-imagen" for="inputImagen">
                    Elegir imagen
                </label>
                <input type="file" id="inputImagen" accept="image/*" required>

                <div class="preview-caja">
                    <img id="preview" alt="Previsualización">
                    <span id="textoPreview">Vista previa de la imagen</span>
                </div>

                <button type="submit" id="btnEnviar">Analizar Imagen</button>
            </form>

            <div id="resultado" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const inputImagen = document.getElementById('inputImagen');
        const preview = document.getElementById('preview');
        const textoPreview = document.getElementById('textoPreview');
        const formulario = document.getElementById('formulario');
        const btnEnviar = document.getElementById('btnEnviar');
        const divResultado = document.getElementById('resultado');

        // Mostrar la imagen apenas el usuario la selecciona
        inputImagen.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.add('visible');
                    textoPreview.style.display = 'none';
                    divResultado.classList.remove('error');
                    divResultado.innerHTML = ''; // Limpiar resultados anteriores
                }
                reader.readAsDataURL(file);
            }
        });

        // Enviar la imagen al backend con Fetch
        formulario.addEventListener('submit', async function(e) {
            e.preventDefault();
            const file = inputImagen.files[0];
            if (!file) return;

            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Procesando...';
            divResultado.innerHTML = '';

            const formData = new FormData();
            formData.append('imagen', file);

            try {
                // Al estar en el mismo servidor, usamos ruta relativa
                const response = await fetch('/predecir', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    divResultado.classList.remove('error');
                    divResultado.innerHTML = `¡Es un ${data.numero_predicho}! <br><small>Confianza: ${data.confianza}%</small>`;
                } else {
                    divResultado.classList.add('error');
                    divResultado.innerHTML = `Error: ${data.error}`;
                }
            } catch (error) {
                divResultado.classList.add('error');
                divResultado.innerHTML = 'Error de conexión con el servidor.';
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Analizar Imagen';
            }
        });
    </script>
</body>
</html>
